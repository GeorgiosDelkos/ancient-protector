# Mutation testing of the code a PR changes: cargo-mutants
# breaks each changed function in small ways (returns a default, flips a comparison) and fails
# when the tests still pass, which means the tests do not check that code (TST-19). From the
# cargo-mutants guide, https://mutants.rs/pr-diff.html (`--in-diff`), with house pinning.
# Delete for a crate whose test suite takes more than a few minutes: every mutant reruns it.
# Not required on day one: start it as advisory, make it required once it is green.
permissions:
  contents: read
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: mutants
jobs:
  mutants:
    if: ${{ !github.event.pull_request.draft }}
    # Linux, not macOS: the tests use no macOS tool (they fake sw_vers, ssh and the agents), and
    # Linux runners are faster and more of them run at once. One runner took about 60 s per
    # mutant, 3.5 hours for the 218 of PR 7, so the mutants are split across shards
    # (https://mutants.rs/shards.html). The count is arbitrary: about 25 mutants per shard.
    runs-on: ubuntu-latest
    name: cargo mutants (PR diff, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
        with:
          # The whole history, so the diff against the base branch can be taken.
          fetch-depth: 0
          persist-credentials: false
      - name: Diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/$BASE_REF.." | tee git.diff
      - name: Install stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # branch=master
        with:
          toolchain: stable
      - name: cargo install cargo-mutants
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # tag=v2.88.0
        with:
          tool: cargo-mutants
      - name: cargo mutants
        env:
          SHARD: ${{ matrix.shard }}
        run: >-
          cargo mutants --no-shuffle -vV --in-diff git.diff --cargo-arg=--locked
          --shard "$SHARD/8"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # tag=v7.0.2
        with:
          name: mutants.out-${{ matrix.shard }}
          path: mutants.out
