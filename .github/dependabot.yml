# From jonhoo/rust-ci-conf @ de512da1e85b, plus the house 7-day
# cooldown (gh-actions-style): a release must age a week before a PR, which lets a compromised or
# broken release be yanked first. This is an application, so patch and minor cargo updates are
# taken (grouped) to keep the shipped lockfile current.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      gha-bump:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      cargo-bump:
        applies-to: version-updates
        patterns:
          - "*"
